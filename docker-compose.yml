# Development stack (TZ 32.1). Not for production — see docker-compose.prod.yml.
#
# Credentials here are local-only fixtures. Production secrets come from a secret manager and are
# never committed (SEC-010).

name: mentortaskflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mentortaskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the three non-overlapping database roles of TZ 12.6: app, migrator, retention.
      - ./scripts/db/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mentortaskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP sink — no mail leaves the machine during development.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # mtf-migrator: the same image, run once, applies migrations and provisions the first tenant
  # (DEPLOY-016, DEPLOY-022). It connects as mentortaskflow_migrator — the only role with DDL rights
  # — while the API connects as mentortaskflow_app, which has none (DEPLOY-017).
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=mentortaskflow;Username=mentortaskflow_migrator;Password=mentortaskflow_dev"
      Auth__JwtSigningKey: "${AUTH__JWT_SIGNING_KEY:-local-development-signing-key-not-for-any-real-deployment}"
      Auth__AppBaseUrl: "http://localhost:5173"
      # DEPLOY-023. No password variable exists: the first administrator receives a set-password link
      # in this container's log and nothing else (DEPLOY-024, DEPLOY-025).
      Bootstrap__OrganizationName: "SoftClub Academy"
      Bootstrap__OrganizationSlug: "softclub-academy"
      Bootstrap__HeadOfficeName: "Главный офис"
      Bootstrap__HeadOfficeCode: "HQ"
      Bootstrap__HeadOfficeTimeZone: "Asia/Dushanbe"
      Bootstrap__AdminEmail: "admin@mentortaskflow.local"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=mentortaskflow;Username=mentortaskflow_app;Password=mentortaskflow_dev"
      # False even locally: the migrator owns the schema, so both paths behave the same everywhere
      # and a developer never sees a race the deployment would not have.
      Database__MigrateOnStartup: "false"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Auth__JwtSigningKey: "${AUTH__JWT_SIGNING_KEY:-local-development-signing-key-not-for-any-real-deployment}"
      Auth__AppBaseUrl: "http://localhost:5173"
    ports:
      - "5000:8080"

volumes:
  postgres-data:
  minio-data:
