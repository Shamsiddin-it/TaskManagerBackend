# CI pipeline of DEPLOY-027:
# build → unit tests → integration tests → architecture tests → dependency scan → image build
# → publish the OpenAPI specification as an artifact.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MentorTaskFlow.sln

      # NuGetAudit is on and NU1903/NU1904 are errors (SEC-014): a dependency with a known
      # High or Critical advisory fails the build here rather than reaching an image.
      - name: Build
        run: dotnet build MentorTaskFlow.sln --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/MentorTaskFlow.UnitTests/MentorTaskFlow.UnitTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults

      # Fast and dependency-free: keeps a layering violation from being discovered only after the
      # slower integration suite has run.
      - name: Architecture tests
        run: >
          dotnet test tests/MentorTaskFlow.ArchitectureTests/MentorTaskFlow.ArchitectureTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=architecture.trx"
          --results-directory TestResults

      # Testcontainers starts PostgreSQL (and, from Phase 10, MinIO) against the runner's Docker
      # daemon; the environment is ephemeral (TZ 32.1, Test).
      - name: Integration tests
        run: >
          dotnet test tests/MentorTaskFlow.IntegrationTests/MentorTaskFlow.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

  openapi:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # API-002: the specification is generated from code and published as a CI artifact. It is the
      # machine-readable companion to Приложение D; a divergence between them is a defect.
      - name: Generate OpenAPI specification
        run: |
          dotnet tool install --global Swashbuckle.AspNetCore.Cli --version 10.2.1
          dotnet build src/MentorTaskFlow.Api/MentorTaskFlow.Api.csproj --configuration Release
          swagger tofile --output openapi-v1.json \
            src/MentorTaskFlow.Api/bin/Release/net10.0/MentorTaskFlow.Api.dll v1

      - name: Upload OpenAPI specification
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi-v1.json

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mentortaskflow:${{ github.sha }} .

      # SEC-014: the image is scanned as well as the dependency graph. Critical and High findings
      # fail the job — an image is not shipped with a known exploitable vulnerability.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mentortaskflow:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
